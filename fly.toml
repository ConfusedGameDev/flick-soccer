# Fly.io app for the match server (server/). Deploy: `fly deploy` from the repo root.
app = "flick-soccer-match"
primary_region = "dfw"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  # Rooms live in memory, so keep one machine warm and never scale to zero mid-match.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
