# Generated by the port-app skill. Builds the web app, syncs it into the
# Capacitor projects and produces Android (.apk/.aab) and iOS (.ipa) builds.
# Without signing secrets it still succeeds (debug apk, unsigned ipa).
name: Mobile builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "Flick Soccer"
  WEB_DIR: "dist"
  IOS_SCHEME: App
  NODE_VERSION: 22

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: ${{ env.WEB_DIR }}
          retention-days: 7

  android:
    name: Android
    needs: web
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: ${{ env.WEB_DIR }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships an Android SDK at $ANDROID_HOME; Gradle downloads any missing platform/build-tools.
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Build signed release
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ needs.web.outputs.version }} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apksigner.txt"
          head -3 "$RUNNER_TEMP/apksigner.txt"
      - name: Build debug (no keystore secrets yet)
        if: env.KEYSTORE_B64 == ''
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ needs.web.outputs.version }}
          echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: built a debug APK. Run the port-app bootstrap-app script to get signed release builds."
      # Google's publishing API occasionally answers "service unavailable"; one retry after a minute covers it.
      - name: Upload to Google Play (internal testing track)
        id: play
        if: env.KEYSTORE_B64 != '' && env.PLAY_SA_JSON != ''
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.confusedgame.flicksoccer
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
      - name: Wait before retrying the Play upload
        if: steps.play.outcome == 'failure'
        run: sleep 60
      - name: Upload to Google Play (retry)
        if: steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.confusedgame.flicksoccer
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
      - name: Google Play upload skipped
        if: env.KEYSTORE_B64 == '' || env.PLAY_SA_JSON == ''
        run: |
          echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret (or no keystore) - the .aab is an artifact only. Create the app in Play Console, then rerun the port-app bootstrap-app script to publish to the internal testing track."
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 30

  ios:
    name: iOS
    needs: web
    runs-on: macos-latest
    env:
      CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
      APP_VERSION: ${{ needs.web.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: ${{ env.WEB_DIR }}
      - run: npx cap sync ios
      - run: xcodebuild -version

      - name: Import signing certificate and profile
        if: env.CERT_B64 != ''
        env:
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Installed profile $UUID"

      - name: Archive and export (signed)
        if: env.CERT_B64 != ''
        run: |
          set -euo pipefail
          xcodebuild -project "ios/App/App.xcodeproj" -scheme "$IOS_SCHEME" -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict><key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" | tail -20
          mkdir -p out
          cp "$RUNNER_TEMP"/export/*.ipa "out/${APP_NAME// /-}.ipa"

      - name: Upload to TestFlight
        if: env.CERT_B64 != '' && env.ASC_KEY_ID != ''
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$KEY"
          sed 's#<string>export</string>#<string>upload</string>#' "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/UploadOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates | tail -20
          echo "::notice::Build $BUILD_NUMBER uploaded to App Store Connect (TestFlight processes it in a few minutes)."

      - name: Archive (unsigned, no certificate secrets yet)
        if: env.CERT_B64 == ''
        run: |
          set -euo pipefail
          xcodebuild -project "ios/App/App.xcodeproj" -scheme "$IOS_SCHEME" -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tail -40
          mkdir -p "$RUNNER_TEMP/Payload" out
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/out/${APP_NAME// /-}-unsigned.ipa" Payload)
          echo "::notice::No IOS_CERT_P12_BASE64 secret: produced an unsigned .ipa. Run the port-app bootstrap-app script for a signed TestFlight build."

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out/*.ipa
          retention-days: 30

      - name: Remove temporary keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
